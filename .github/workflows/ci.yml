name: CI

on:
  push:
    branches: [main, windows]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Hook tests
        run: python -m unittest discover -s tests/python -v
      - name: Extension tests
        run: node --test tests/node/*.test.js
      # Runs the hook exactly as hooks/hooks.json tells Claude Code to: exec form (command + args) without a
      # shell, shell form through sh. main targets macOS and Linux, the windows branch targets Windows.
      - name: Hook runs as Claude Code calls it
        if: runner.os != 'Windows' || github.ref_name == 'windows' || github.base_ref == 'windows'
        run: python tests/run_hooks_json.py
      - name: Build VSIX
        run: python vscode/build_vsix.py
      - name: Upload VSIX
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: session-guard-vsix
          path: dist/*.vsix

  # The windows branch is main plus one file. Anything else that differs is drift.
  windows-branch-drift:
    if: github.ref_name == 'windows' || github.base_ref == 'windows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Only hooks/hooks.json differs from main
        run: |
          changed=$(git diff --name-only origin/main HEAD)
          echo "differs from main: ${changed:-nothing}"
          test "$changed" = "hooks/hooks.json"
