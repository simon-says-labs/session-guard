name: CI

on:
  push:
    branches: [main, windows]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Hook tests
        run: python -m unittest discover -s tests/python -v
      - name: Extension tests
        run: node --test tests/node/*.test.js
      - name: Hook runs as Claude Code calls it (exec form, plain "python")
        run: |
          echo '{"hook_event_name":"PreToolUse","tool_name":"AskUserQuestion","session_id":"ci","tool_input":{"questions":[{"question":"CI?"}]}}' \
            | SESSION_GUARD_STATE="$RUNNER_TEMP/sg" SESSION_GUARD_SOUND=off python hooks/session_guard_hook.py
          python -c "import json,os;s=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'sg','sessions','ci.json')));assert s['reason']=='question',s;print('status file ok:',s['reason'])"
      - name: Build VSIX
        run: python vscode/build_vsix.py
      - name: Upload VSIX
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: session-guard-vsix-windows
          path: dist/*.vsix
